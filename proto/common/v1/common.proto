syntax = "proto3";

package dash.common.v1;

option go_package = "github.com/dash-io/dash/proto/common/v1;commonv1";

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

message Sort {
  string field = 1;
  enum Order {
    ASC = 0;
    DESC = 1;
  }
  Order order = 2;
}

message Metadata {
  map<string, string> labels = 1;
  int64 created_at = 2;
  int64 updated_at = 3;
}

message Error {
  string code = 1;
  string message = 2;
  repeated ErrorDetail details = 3;
}

message ErrorDetail {
  string field = 1;
  string message = 2;
}

message Empty {}

message VersionInfo {
  string version = 1;
  string build = 2;
  string commit = 3;
}
