syntax = "proto3";

package bnpm.telemetry.v1;

option go_package = "github.com/bnpm-io/bnpm/proto/telemetry/v1;telemetryv1";

import "common/v1/common.proto";

service TelemetryService {
  rpc IngestEvents(IngestEventsRequest) returns (IngestEventsResponse);
  rpc IngestMetrics(IngestMetricsRequest) returns (IngestMetricsResponse);
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);
  rpc QueryMetrics(QueryMetricsRequest) returns (QueryMetricsResponse);
  rpc Health(bnpm.common.v1.Empty) returns (HealthResponse);
  rpc Ingest(IngestRequest) returns (IngestResponse);
  rpc IngestStream(stream TelemetryEvent) returns (IngestResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
}

message TelemetryEvent {
  string id = 1;
  string type = 2;
  string source = 3;
  string name = 4;
  string level = 5;
  map<string, string> attributes = 6;
  bytes payload = 7;
  int64 timestamp = 8;
  string trace_id = 9;
  string span_id = 10;
}

message Metric {
  string id = 1;
  string name = 2;
  string type = 3;
  double value = 4;
  map<string, string> labels = 5;
  int64 timestamp = 6;
  string source = 7;
  string unit = 8;
}

message HealthResponse {
  bool healthy = 1;
  int64 uptime_seconds = 2;
  int64 events_ingested = 3;
  int64 metrics_ingested = 4;
  string version = 5;
}

message IngestEventsRequest {
  repeated TelemetryEvent events = 1;
  string source = 2;
}

message IngestEventsResponse {
  int32 ingested = 1;
  int32 failed = 2;
  repeated string errors = 3;
}

message IngestMetricsRequest {
  repeated Metric metrics = 1;
  string source = 2;
}

message IngestMetricsResponse {
  int32 ingested = 1;
  int32 failed = 2;
  repeated string errors = 3;
}

message QueryEventsRequest {
  string query = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  map<string, string> filters = 4;
  bnpm.common.v1.Pagination pagination = 5;
  repeated string event_types = 6;
  string source = 7;
}

message QueryEventsResponse {
  repeated TelemetryEvent events = 1;
  int32 total = 2;
  double took_ms = 3;
  bnpm.common.v1.Pagination pagination = 4;
}

message QueryMetricsRequest {
  repeated string metric_names = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  string interval = 4;
  map<string, string> filters = 5;
  string aggregation = 6;
}

message QueryMetricsResponse {
  map<string, MetricSeries> metrics = 1;
  double took_ms = 2;
}

message IngestRequest {
  repeated TelemetryEvent events = 1;
}

message IngestResponse {
  int32 ingested = 1;
  int32 failed = 2;
  repeated string errors = 3;
}

message QueryRequest {
  string query = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  map<string, string> filters = 4;
  bnpm.common.v1.Pagination pagination = 5;
  repeated string group_by = 6;
}

message QueryResult {
  map<string, string> dimensions = 1;
  double value = 2;
  int64 count = 3;
  int64 timestamp = 4;
}

message QueryResponse {
  repeated QueryResult results = 1;
  bnpm.common.v1.Pagination pagination = 2;
  double took_ms = 3;
}

message GetMetricsRequest {
  repeated string metric_names = 1;
  int64 start_time = 2;
  int64 end_time = 3;
  string interval = 4;
}

message MetricPoint {
  int64 timestamp = 1;
  double value = 2;
}

message GetMetricsResponse {
  map<string, MetricSeries> metrics = 1;
}

message MetricSeries {
  string name = 1;
  string unit = 2;
  repeated MetricPoint points = 3;
  map<string, string> labels = 4;
}
