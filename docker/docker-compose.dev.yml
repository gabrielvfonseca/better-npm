networks:
  bnpm-net:
  bnpm-public:

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["infra", "all"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: bnpm_dev
      POSTGRES_USER: bnpm
      POSTGRES_PASSWORD: bnpm_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnpm"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bnpm-net

  redis:
    image: redis:7-alpine
    profiles: ["infra", "all"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes --requirepass bnpm_dev_redis
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bnpm_dev_redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bnpm-net

  minio:
    image: minio/minio:latest
    profiles: ["infra", "all"]
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    environment:
      MINIO_ROOT_USER: bnpm
      MINIO_ROOT_PASSWORD: bnpm_dev_minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bnpm-net

  api:
    profiles: ["apps", "all"]
    build:
      context: ..
      dockerfile: ./Dockerfile.api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bnpm:bnpm_dev_password@postgres:5432/bnpm_dev
      REDIS_URL: redis://:bnpm_dev_redis@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: bnpm
      MINIO_SECRET_KEY: bnpm_dev_minio
    volumes:
      - ../apps/api/src:/app/apps/api/src
      - ../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bnpm-net
      - bnpm-public

  registry:
    profiles: ["apps", "all"]
    build:
      context: ..
      dockerfile: ./Dockerfile.registry
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bnpm:bnpm_dev_password@postgres:5432/bnpm_dev
      REDIS_URL: redis://:bnpm_dev_redis@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: bnpm
      MINIO_SECRET_KEY: bnpm_dev_minio
    volumes:
      - ../../apps/registry/src:/app/apps/registry/src
      - ../packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - bnpm-net
      - bnpm-public

  worker-downloads:
    profiles: ["workers", "all"]
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: downloads
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bnpm:bnpm_dev_password@postgres:5432/bnpm_dev
      REDIS_URL: redis://:bnpm_dev_redis@redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: bnpm
      MINIO_SECRET_KEY: bnpm_dev_minio
      WORKER_TYPE: downloads
    volumes:
