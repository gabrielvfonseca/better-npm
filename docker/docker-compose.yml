networks:
  bnpm-net:
    internal: true
  bnpm-public:
    internal: false

volumes:
  postgres_data:
  redis_data:
  minio_data:

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://bnpm:${DB_PASSWORD:-bnpm_password}@postgres:5432/bnpm
  REDIS_URL: redis://:${REDIS_PASSWORD:-bnpm_redis}@redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_USER:-bnpm}
  MINIO_SECRET_KEY: ${MINIO_PASSWORD:-bnpm_minio}

x-infra-depends: &infra-depends
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bnpm
      POSTGRES_USER: bnpm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bnpm_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnpm"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - bnpm-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-bnpm_redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bnpm_redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - bnpm-net

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-bnpm}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-bnpm_minio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - bnpm-net

  api:
    build:
      context: ..
      dockerfile: ./Dockerfile
      args:
        APP: api
        PACKAGE: app-api
        PORT: 3000
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      <<: *app-env
    <<: *infra-depends
    networks:
      - bnpm-net
      - bnpm-public

  registry:
    build:
      context: ..
      dockerfile: ./Dockerfile
      args:
        APP: registry
        PACKAGE: registry
        PORT: 4000
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-4000}:4000"
    environment:
      <<: *app-env
    <<: *infra-depends
    networks:
      - bnpm-net
      - bnpm-public

  worker-downloads:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: downloads
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: downloads
    <<: *infra-depends
    networks:
      - bnpm-net

  worker-indexing:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: indexing
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: indexing
    <<: *infra-depends
    networks:
      - bnpm-net

  worker-metadata:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: metadata
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: metadata
    <<: *infra-depends
    networks:
      - bnpm-net

  worker-scanning:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: scanning
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: scanning
    <<: *infra-depends
    networks:
      - bnpm-net

  worker-signatures:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: signatures
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: signatures
    <<: *infra-depends
    networks:
      - bnpm-net

  worker-analytics:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: analytics
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: analytics
    <<: *infra-depends
    networks:
      - bnpm-net

  worker-cleanup:
    build:
      context: ..
      dockerfile: ./Dockerfile.worker
      args:
        WORKER_NAME: cleanup
    restart: unless-stopped
    environment:
      <<: *app-env
      WORKER_TYPE: cleanup
    <<: *infra-depends
    networks:
      - bnpm-net
