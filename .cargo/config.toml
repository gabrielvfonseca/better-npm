[alias]
b = "build"
br = "build --release"
t = "test"
c = "check"
cl = "clippy --all-targets"
fmt = "fmt --all"
fix = "fix --all-targets --allow-dirty"
doc = "doc --workspace --no-deps"
bench = "bench --workspace"
outdated = "outdated --workspace"
upgrade = "update --workspace"

[registries.bnpm]
index = "https://github.com/org/bnpm-registry"

[net]
git-fetch-with-cli = true
retry = 3

[build]
jobs = 8
target-dir = "target"
rustc-wrapper = "sccache"

[term]
verbose = false
progress.when = "auto"

[env]
BNPM_LOG = "info"
BNPM_CACHE_DIR = { value = ".cache/bnpm", relative = true }

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld", "-C", "target-cpu=x86-64-v3"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-haswell"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[http]
proxies = []
ssl-version = "tlsv1.3"
timeout = 30
user-agent = "bnpm (cargo)"
