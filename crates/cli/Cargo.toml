[package]
name = "bnpm-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Bnpm package manager CLI - main binary entrypoint"

[[bin]]
name = "bnpm"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
bnpm-resolver = { path = "../resolver" }
bnpm-installer = { path = "../installer" }
bnpm-downloader = { path = "../downloader" }
bnpm-lockfile = { path = "../lockfile" }
bnpm-config = { path = "../config" }
bnpm-telemetry = { path = "../telemetry" }
bnpm-logger = { path = "../logger" }
bnpm-diagnostics = { path = "../diagnostics" }
bnpm-progress = { path = "../progress" }
bnpm-network = { path = "../network" }
bnpm-package = { path = "../package" }
bnpm-manifest = { path = "../manifest" }
bnpm-store = { path = "../store" }
bnpm-cache = { path = "../cache" }
bnpm-concurrency = { path = "../concurrency" }
bnpm-sandbox = { path = "../sandbox" }
bnpm-plugin = { path = "../plugin" }
bnpm-registry-client = { path = "../registry-client" }
bnpm-runtime = { path = "../runtime" }
bnpm-publisher = { path = "../publisher" }
bnpm-workspace = { path = "../workspace" }
semver = { workspace = true }
dirs = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = { workspace = true }
