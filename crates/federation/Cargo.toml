[package]
name = "bnpm-federation"
version = { workspace = true }
edition = "2024"
license = "MIT"
authors = ["Bnpm Team"]

[dependencies]
bnpm-capsule = { path = "../capsule" }
bnpm-cid = { path = "../cid" }
bnpm-governance = { path = "../governance" }
bnpm-manifest = { path = "../manifest" }
bnpm-proto = { path = "../proto" }
bnpm-provenance = { path = "../provenance" }
bnpm-registry = { path = "../registry" }
bnpm-store = { path = "../store" }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
bytes = { workspace = true }
async-trait = "0.1"
dashmap = { workspace = true }
url = { workspace = true }
chrono = { workspace = true }
blake3 = "1"
hex = "0.4"
tempfile = "3"

[dev-dependencies]
tokio-test = "0.4"