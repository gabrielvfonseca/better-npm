[package]
name = "dash-conformance-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Conformance test runner binary — runs CID/capsule/store spec tests from vitest"

[[bin]]
name = "dash-conformance-runner"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
blake3 = { workspace = true }
dash-cid = { workspace = true }
dash-capsule = { workspace = true }
dash-store = { path = "../store" }
