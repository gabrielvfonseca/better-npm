[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/sbom", "crates/capability", "crates/policy", "crates/agent", "crates/npm-bridge"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Bnpm Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "compression-br"] }
axum = "0.8"
tonic = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
regex = "1"
glob = "0.3"
walkdir = "2"
rayon = "1"
futures = "0.3"
futures-util = "0.3"
dashmap = "6"
parking_lot = "0.12"
once_cell = "1"
arc-swap = "1"
moka = { version = "0.12", features = ["sync"] }
schemars = "0.8"
semver = { version = "1", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
ed25519-dalek = "2"
rsa = "0.9"
aes-gcm = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "migrate", "uuid", "chrono"] }
deadpool = "0.12"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
parquet = { version = "0.12", features = ["arrow", "async"] }
lance = "0.19"
criterion = { version = "0.5", features = ["async_futures"] }
testcontainers = "0.23"
flate2 = "1"
tar = "0.4"
zip = "2"
zstd = "0.13"
url = "2"
mime = "0.3"
mime_guess = "2"
http = "1"
http-body = "1"
indoc = "2"
toml = "0.8"
serde_yaml = "0.9"
rand = "0.8"
tempfile = "3"
fs2 = "0.4"
ciborium = "0.2"
ciborium-io = "0.2"
bnpm-cid = { path = "crates/cid" }
bnpm-capsule = { path = "crates/capsule" }
bnpm-lockfile = { path = "crates/lockfile" }
bnpm-proto = { path = "crates/proto" }
bnpm-provenance = { path = "crates/provenance" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
debug = true
opt-level = 0
