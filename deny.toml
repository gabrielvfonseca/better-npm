# cargo-deny configuration for Bnpm
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
severity-threshold = "low"
ignore = []

[licenses]
unlicensed = "deny"
allow-osi-fsf-free = "neither"
default = "deny"
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "BSL-1.0",
  "Zlib",
  "0BSD",
  "CC0-1.0",
]
deny = [
  "GPL-2.0",
  "GPL-3.0",
  "AGPL-3.0",
  "LGPL-3.0",
  "CC-BY-NC-4.0",
  "Commons-Clause",
  "BUSL-1.1",
]
exceptions = []
skip = []
skip-tree = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = [
  { name = "tokio", version = "*" },
  { name = "hyper", version = "*" },
]

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-git = []
