# Dash Configuration
# This file is installed to $(brew --prefix)/etc/dash.toml

[core]
# Log level: trace, debug, info, warn, error
log_level = "info"

# Enable or disable color output
color = true

# Default registry URL
registry = "https://registry.dash.dev"

[cache]
# Cache directory path
directory = "/usr/local/var/dash/cache"

# Maximum cache size in bytes (0 = unlimited)
max_size = 5368709120

# Time-to-live for cached packages in seconds (default: 1 hour)
ttl = 3600

[network]
# Connection timeout in seconds
timeout = 30

# Maximum number of concurrent downloads
concurrency = 8

# HTTP proxy URL (optional)
# proxy = "http://proxy.example.com:8080"

[install]
# Default installation strategy: copy, link, hardlink
strategy = "link"

# Whether to install optional dependencies by default
optional_deps = true

# Whether to install dev dependencies by default
dev_deps = true

[telemetry]
# Enable anonymous usage telemetry
enabled = false

# Telemetry endpoint
endpoint = "https://telemetry.dash.dev/v1/events"

[auth]
# Default authentication token (optional)
# token = ""

# Token storage location
token_store = "keychain"
